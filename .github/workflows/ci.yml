name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STL_SHERPA_SOFTWARE_RENDERING: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:integration
      - name: Enable Chromium user-namespace sandbox
        # Ubuntu's AppArmor restriction blocks Electron and extracted AppImages.
        # This applies only to the disposable hosted runner; keep Chromium's
        # renderer/worker sandbox enabled during both acceptance tests.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test the Electron app
        run: xvfb-run -a npm run test:app
        env:
          STL_SHERPA_SMOKE_OUTPUT: test-results/app
      - name: Retain app diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-test-linux
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
      - run: npm run build:icon && npm run dist:linux
      - name: Test packaged AppImage
        timeout-minutes: 5
        run: xvfb-run -a npm run test:packaged
      - name: Retain packaged diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-test-linux
          path: test-results/packaged/
          if-no-files-found: warn
          retention-days: 7

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      STL_SHERPA_SOFTWARE_RENDERING: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:app
        env:
          STL_SHERPA_SMOKE_OUTPUT: test-results/app
      - name: Retain app diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-test-${{ matrix.os }}
          path: test-results/app/
          if-no-files-found: warn
          retention-days: 7
