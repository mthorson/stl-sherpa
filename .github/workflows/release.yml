name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: mac-arm64
            dist: dist:mac
            args: --arm64
          - os: macos-15-intel
            name: mac-x64
            dist: dist:mac
            args: --x64
          - os: windows-latest
            name: windows-x64
            dist: dist:win
            args: --x64
          - os: ubuntu-24.04
            name: linux-x64
            dist: dist:linux
            args: --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      STL_SHERPA_SOFTWARE_RENDERING: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:integration
        if: runner.os == 'Linux'
      - run: npm run build:icon
      - name: Build release installers
        run: npm run ${{ matrix.dist }} -- ${{ matrix.args }}
        env:
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
      - name: Install native package and verify macOS signing
        run: node scripts/install-release.cjs
      - name: Test installed app (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm run test:packaged
        timeout-minutes: 6
        env:
          STL_SHERPA_SMOKE_OUTPUT: test-results/installed
      - name: Test installed Debian package with Ubuntu restrictions enabled
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged
        timeout-minutes: 6
        env:
          STL_SHERPA_SMOKE_OUTPUT: test-results/deb
      - name: Install AppImage with its scoped AppArmor profile
        if: runner.os == 'Linux'
        run: |
          sudo install -m 755 release/*.AppImage /opt/stl-sherpa.AppImage
          sudo install -m 644 build/stl-sherpa-appimage.apparmor /etc/apparmor.d/stl-sherpa-appimage
          sudo apparmor_parser -r /etc/apparmor.d/stl-sherpa-appimage
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Test AppImage with Ubuntu restrictions enabled
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged -- /opt/stl-sherpa.AppImage
        timeout-minutes: 6
        env:
          STL_SHERPA_SMOKE_OUTPUT: test-results/appimage
      - name: Retain installer diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-test-${{ matrix.name }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF#refs/tags/}" != "$version" ]]; then
            echo "Release tag does not match package version" >&2
            exit 1
          fi
          cp build/stl-sherpa-appimage.apparmor artifacts/
          (cd artifacts && sha256sum -- * > SHA256SUMS.txt)
          gh release create "$version" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "stl-sherpa $version" \
            --draft --prerelease \
            --notes-file "docs/releases/$version.md" \
            artifacts/*
